
<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <title>Zadatak 4</title>
    <style>
        body {
            font-family: "Times New Roman";
        }

        h2 {
            margin-bottom: 20px;
        }

        #napredak {
            width: 130px;
            background-color: #ddd;
            float: left;
            margin-right: 5px;
        }

        #popunjeno {
            width: 60%;
            background-color: #8099a8;
            color: #8099a8;
        }

        #korak {
            margin: 0;
        }

        #forma {
            clear: both;
            padding-top: 15px;
        }

        .polje {
            margin-bottom: 5px;
        }

        #dugmad {
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h2>Unos privatnih podataka</h2>

    <div id="napredak">
        <div id="popunjeno">.</div>
    </div>

    <p id="korak">Korak 2 od 5</p>

    <form id="forma">
        <div class="polje">
            <label for="datum">Datum rođenja:</label>
            <input type="date" id="datum" name="datum">
        </div>

        <div class="polje">
            <label for="email">Email adresa:</label>
            <input type="email" id="email" name="email">
        </div>

        <div id="dugmad">
            <button type="button">&lt;&lt; Nazad</button>
            <button type="button">Dalje &gt;&gt;</button>
        </div>
    </form>

</body>
</html>
